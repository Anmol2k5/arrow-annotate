name: Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, work]
    tags: ["v*"]
    paths:
      - "arrow/**"
      - "main.py"
      - "browser_extension/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-build.txt
      - name: Install verified Inno Setup 6.4.3
        shell: pwsh
        run: |
          $Compiler = & ./scripts/install-inno.ps1
          "INNO_COMPILER=$Compiler" >> $env:GITHUB_ENV
      - name: Test and build Windows executables, installer and portable zip
        shell: pwsh
        # Only a pushed release tag may receive signing credentials. PR builds
        # (including same-repository PRs) always exercise the unsigned path.
        env:
          ARROW_SIGN_PFX_BASE64: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_PFX_BASE64 || '' }}
          ARROW_SIGN_PFX_PASSWORD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_SIGN_PFX_PASSWORD || '' }}
          ARROW_SIGN_CERT_THUMBPRINT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_SIGN_CERT_THUMBPRINT || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item build/windows -ItemType Directory -Force | Out-Null
          try {
            & ./scripts/build-windows.ps1 -InnoCompiler $env:INNO_COMPILER *>&1 |
              Tee-Object -FilePath build/windows/ci-build.log
          } catch {
            $Diagnostic = $_.Exception.Message
            if (Test-Path build/windows/ci-build.log) {
              $Diagnostic += "`n" + ((Get-Content build/windows/ci-build.log -Tail 40) -join "`n")
            }
            $Escaped = $Diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows build failed::$Escaped"
            throw
          }
      - name: Cache explicit offline speech test weights
        uses: actions/cache@v4
        with:
          path: build/windows/voice-model-home/models
          key: windows-whisper-base-v1-${{ hashFiles('arrow/speech/offline.py') }}
      - name: Exercise frozen speech, installed apps, then uninstall
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Preserve installers, hashes, provenance and smoke reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Arrow-Annotate-Windows-x64-${{ github.run_number }}
          path: |
            dist/artifacts/
            dist/smoke-reports/
            build/windows/ci-build.log
            build/windows/source-tests.xml
            build/windows/native-clipboard.xml
            build/windows/native-ui-*.xml
            build/windows/pyinstaller/windows/warn-windows.txt
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    # Publication is authorized only by pushing a version tag, after every
    # frozen-app/MCP/install/uninstall check in build-and-test has passed.
    needs: build-and-test
    if: github.repository == 'Anmol2k5/arrow-annotate' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: Arrow-Annotate-Windows-x64-${{ github.run_number }}
          path: verified-build
      - name: Verify final release files and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${RELEASE_TAG#v}"
          cd verified-build/dist/artifacts
          test -s "Arrow-Annotate-Setup-$version-x64.exe"
          test -s "Arrow-Annotate-Portable-$version-x64.zip"
          test -s build-provenance.json
          test -s build-requirements.txt
          test -s third-party-manifest.json
          sha256sum --check SHA256SUMS.txt
          signing=$(python -c 'import json; print(json.load(open("build-provenance.json"))["signing"])')
          case "$signing" in
            unsigned) echo 'Windows artifacts are unsigned. Windows may display an unknown-publisher warning.' > release-notes.txt ;;
            trusted-authenticode-verified) echo 'The application executables and Setup have trusted, timestamped Authenticode signatures.' > release-notes.txt ;;
            *) echo 'Unknown signing provenance'; exit 1 ;;
          esac
          echo '' >> release-notes.txt
          echo 'Download Setup for a per-user installation, or extract the entire portable zip. Compare SHA256SUMS.txt before running. Updates and uninstall preserve user settings and captures.' >> release-notes.txt
          echo '' >> release-notes.txt
          echo 'Native packaging/runtime checks passed. Real microphone/Hinglish accuracy, multi-monitor/DPI alignment and authenticated agent sessions still require interactive validation on your Windows desktop.' >> release-notes.txt
          echo "[Run the guided Windows tests](https://github.com/Anmol2k5/arrow-annotate/blob/$RELEASE_TAG/docs/windows-interactive-testing.md)." >> release-notes.txt
      - name: Publish public GitHub Release downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd verified-build/dist/artifacts
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "Arrow Annotate $RELEASE_TAG" --latest \
            --notes-file release-notes.txt \
            Arrow-Annotate-Setup-*-x64.exe Arrow-Annotate-Portable-*-x64.zip \
            SHA256SUMS.txt build-provenance.json build-requirements.txt third-party-manifest.json
