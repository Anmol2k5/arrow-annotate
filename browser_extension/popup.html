<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      padding: 12px;
      color: #0f172a;
    }
    h3 { margin: 0 0 8px; font-size: 14px; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
    }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button {
      flex: 1;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #f8fafc;
      cursor: pointer;
    }
    button:hover { background: #e2e8f0; }
    #status { margin-top: 8px; font-size: 12px; color: #334155; min-height: 1em; }
    .hint { margin-top: 10px; font-size: 11px; color: #64748b; }
    code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h3>Bluely Web Bridge</h3>
  <label for="token">Bearer token</label>
  <input type="password" id="token" placeholder="Paste token…" autocomplete="off" />
  <div class="row">
    <button id="save">Save</button>
    <button id="load">Load from file…</button>
  </div>
  <div id="status"></div>
  <input type="file" id="file" hidden />
  <p class="hint">Token file: <code>~/.arrow/token</code><br />(or <code>$ARROW_HOME/token</code>)</p>
  <script src="popup.js"></script>
</body>
</html>
