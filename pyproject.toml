[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arrow-annotate"
version = "0.1.0"
description = "Arrow Annotate — Local-first spatial-context tool for coding agents"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.8",
    "Flask>=3.0",
    "websockets>=12.0",
    "mss>=9.0.1",
    "Pillow",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "rapidocr-onnxruntime",
    "numpy",
    "keyboard",
    "SpeechRecognition",
    "PyAudio; sys_platform == 'win32'",
    "requests",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.setuptools.packages.find]
include = ["arrow", "arrow.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "arrow.ui.*",
    "arrow.server.*",
    "arrow.context.*",
    "arrow.providers.*",
]
ignore_errors = true


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
